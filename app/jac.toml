[project]
name = "jackal"
version = "0.1.0"
description = "Jackal - all-Jac na-codespace coding agent harness"
entry-point = "main.jac"

# Model config for the ambient `llm` builtin. api_key here is a fallback;
# provider env vars (e.g. OPENROUTER_API_KEY) take precedence.
[byllm.model]
default_model = "mockllm"
api_key = ""

# Pure compute: pin native (dogfooding target). Inference keeps core/edit
# server while its importer tools.jac is server-anchored, so pin explicitly.
[build]
default_codespace = "native"

[placement.pins]
# Constraint layout engine: algebra + layout_relations lower natively
# (N6 retires the §3 server pin — see how-to-lower-all-native). Suites
# green: layout_relations 7/7, roundtrip 36/36. solver stays server
# because its test annex uses time.perf_counter (no native time floor).
"constraints.algebra" = "native"
"constraints.solver" = "server"
"constraints.layout_relations" = "native"
"core.edit" = "native"

# 2026-08-30 vendor sync: the graph-shaped compiler now lowers UI edge
# traversals and walkers. ui.model still demotes because node_id() wraps
# unsupported native jid(); dependent UI modules therefore retain server
# placement until native object identity is available.
"ui.model" = "native"
"ui.mutation" = "native"
"ui.runtime" = "native"

# Verified-lowering UI modules pinned native (2026-08-25 probe): each lowers
# with zero fallback notes under default_codespace=native, but the seal only
# RECORDS/places natively modules with explicit pins — unpinned modules are
# sealed "server" even when they compiled natively. Pin them so the manifest
# matches reality. Modules whose deps are server-pinned stay "server"
# (placement overrides their pins) and are annotated below.
# ui.width: lowers natively now that codepoint-oriented string ops from
# 6fc6807bd landed (len/ord/index/slice return codepoints). Test 10/10.
"ui.width" = "native"
# layout_types must be pinned native so native importers (renderer, cells)
# see Rect/LayoutState layouts; unpinned it seals server and its types erase.
"ui.layout_types" = "native"
"ui.markup" = "native"
# ui.gates: BLOCKED native (2026-08-29 re-probe) — imports InsertText from
# server-pinned ui.events (E5093 boundary); suite passes server-placed.
# ui.focus: BLOCKED native — its test annex calls create_session (ui.runtime)
# whose cross-unit native layout is not visible at focus's seal position.
"ui.gates" = "server"
"ui.progress_bar" = "native"
"ui.focus" = "server"
# ui.terminal / ui.virtual_terminal: Utf8StreamDecoder is now pure Jac
# (correct server-side) but native chr() emits ONE byte for codepoints >
# 0x7F (byte-oriented strings), so native builds would emit mojibake; and
# the full-module native compile crashes the test harness (stale-JIR /
# IR-gen bug, see vendor notes). Server until codepoint-oriented
# ord/chr/len land in the na pathway.
"ui.terminal" = "server"
"ui.virtual_terminal" = "server"
"ui.input" = "native"
"ui.bindings" = "native"
"ui.screen" = "native"
"ui.transcript" = "native"
"ui.renderer" = "native"
"ui.layout" = "native"
"ui.layout_measure" = "native"
"ui.layout_quantize" = "native"
# ui.layout_compile: pin native — test 51/51. The seal-time _solver_of
# demote is contained inside compile_layout and bridged at runtime.
"ui.layout_compile" = "native"
# ui.events: lowers (test annex passes 69/69) BUT seal-time demotes due
# to cross-unit create_session from ui.runtime (UiSession boundary).
# Until that lands natively, events stays server.
"ui.events" = "server"
# inspect/demos: hold for the events frontier above (walker dispatch +
# annex walls); demos additionally spawn walkers (SetProgress).
"ui.inspect" = "server"
"ui.demo_complex_shell" = "server"
"ui.demo_live_shell" = "server"
# agent.protocol: Envelope/InProcessAdapter objs are constructed by server
# session/tui/demo consumers (class-boundary wall, see agent.tool_spec);
# drive_screen pokes shell.transcript/status attributes of server-pinned
# ui.screen ShellScreen across the boundary.
"agent.protocol" = "server"
# agent.tool_spec: LOWERS clean natively when explicitly pinned native
# (verified 2026-08-25: placement=native, build green) but CANNOT be used
# natively while its consumers stay server: server-codespace code that
# constructs a native-pinned obj class dies at runtime with NameError
# (registry.test.jac "as_tool_specs" -> ToolSpec(...) in registry.jac).
# Same wall as E5093 for classes. Unblocks when jaclang gives native objs a
# Python-side mirror, or when llm/session/plugin_bridge/tools/web_tools all
# lower too.
"agent.tool_spec" = "server"
# agent.registry: same class-boundary wall (ToolSpec/RegisteredTool used by
# server llm/plugin_bridge/session); additionally stores handler callables in
# obj fields (B2, fix in flight) and invoke() calls ent.handler(**args).
"agent.registry" = "server"
"agent.plugin_bridge" = "server"
"agent.session" = "server"
# agent.extensions: BLOCKED native, two independent walls (probed 2026-08-25):
# (a) no native json.load/loads in jaclang -> load_extension_decls demotes to
#     Python-only, which forces the whole module server;
# (b) os.path.abspath / os.path.isabs unsupported natively (dirname/join/
#     isfile/getcwd ARE supported); ExtensionStatus/ExtensionDecl are
#     constructed server-side in session.jac anyway (class-boundary wall,
#     see agent.tool_spec above).
"agent.extensions" = "server"

[dependencies]
httpx = "~=0.28"
