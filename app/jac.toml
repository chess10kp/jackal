[project]
name = "jackal"
version = "0.1.0"
description = "Jackal - all-Jac na-codespace coding agent harness"
entry-point = "main.jac"

# Model config for the ambient `llm` builtin. api_key here is a fallback;
# provider env vars (e.g. OPENROUTER_API_KEY) take precedence.
[byllm.model]
default_model = "mockllm"
api_key = ""

# Pure compute: pin native (dogfooding target). Inference keeps core/edit
# server while its importer tools.jac is server-anchored, so pin explicitly.
[build]
default_codespace = "native"

[placement.pins]
# Current frontier: 13 explicit server pins remain (was 15; terminal/vt went
# native 2026-08-31); N6 requires reducing this count to zero. Keep each
# temporary pin annotated with its compiler/runtime wall.
# Constraint layout engine: algebra, layout_relations and solver all lower
# natively (N6 retires the §3 server pin — see how-to-lower-all-native).
# Suites green: layout_relations 7/7, roundtrip 36/36, solver 26/26.
# Solver unblocked by vendor commit: bare from-imported stdlib calls
# (from time import perf_counter) now lower natively; perf_counter maps to
# CLOCK_MONOTONIC via the existing time floor.
"constraints.algebra" = "native"
"constraints.solver" = "native"
"constraints.layout_relations" = "native"
"core.edit" = "native"

# 2026-08-30 vendor sync: graph-shaped edge traversals and walkers now lower
# natively. ui.model's remaining native failures are explicit bound-endpoint
# edge references (`[edge origin ->:Edge:-> target]`); the compiler
# diagnostic gives the supported hop-only forms.
# SEAL walls (2026-08-31 honest seal read): model E5092 UnaryExpr; mutation
# E5092 MainScreen; runtime E5092 attribute access 'key' — dev-native,
# seal-server until fixed.
"ui.model" = "native"
"ui.mutation" = "native"
"ui.runtime" = "native"

# Native-path pins: each module lowers natively in dev runs (dev placement
# honors pins; `jac test` runs pre-seal and ignores them). Seal-time lowering
# is a DIFFERENT context: the precompile may demote a pinned module to the
# server codespace (build-log note). Since the 2026-08-31 vendor fix
# (precompile_bytecode placement join) the sealed MANIFEST placement map
# records the demoted truth, so the artifact is self-describing. Per-module
# seal walls annotated below; unpinned preferred-native modules also demote
# at seal (2026-08-31: ui.cells E5092 UnaryExpr, cordis/core comprehension
# over an element-erased collection, constraints/oracle_driver E5092
# for-loop iterable Name).
# ui.width: lowers natively now that codepoint-oriented string ops from
# 6fc6807bd landed (len/ord/index/slice return codepoints). Test 10/10.
"ui.width" = "native"
# layout_types must be pinned native so native importers (renderer, cells)
# see Rect/LayoutState layouts; unpinned it seals server and its types erase.
# SEAL wall (2026-08-31): E5092 UnaryExpr — dev-native, seal-server.
# ui.markup SEAL wall (2026-08-31): E5092 create_session.
"ui.layout_types" = "native"
"ui.markup" = "native"
# ui.gates: BLOCKED native (2026-08-29 re-probe) — imports InsertText from
# server-pinned ui.events (E5093 boundary); suite passes server-placed.
# ui.focus: BLOCKED native — its test annex calls create_session (ui.runtime)
# whose cross-unit native layout is not visible at focus's seal position.
"ui.gates" = "server"
"ui.progress_bar" = "native"
"ui.focus" = "server"
# ui.terminal / ui.virtual_terminal: native in dev since the 2026-08-31
# re-probe (the stale 2026-08-29 walls were the only dev walls); suites
# green in a no-server sandbox so the runs execute native code (6/6, 15/15;
# `jac test` ignores placement pins). SEAL walls differ (2026-08-31 first
# honest seal read): virtual_terminal E5089 — inherited Terminal.move_cursor
# dispatches self.write across the Python-shadow boundary — FIXED with a
# VT-owned move_cursor override; now demotes on E5092 synchronized_write.
# terminal demotes on E1127 int->u64. Both seal server until those lower.
"ui.terminal" = "native"
"ui.virtual_terminal" = "native"
# ui.input: BLOCKED native (updated 2026-08-31). Source parsers fixed (SGR
# mouse terminator, modified-letter CSI modifier) — suite 21/21 server-side.
# Vendor: emit_find strstr-miss OOB scan fixed in primitives_native.impl.jac
# (negative diff fed to __jac_utf8_cplen whose ult bound scans unboundedly;
# crashed on any str.find miss on a non-NUL-terminated view). RESIDUAL wall:
# with ui.input native the suite SIGSEGVs in InputNormalizer.feed on a fresh
# compile (both O0 and O2; stale artifacts from an older compile run clean):
# an inlined __jac_str_unwrap probe (strlen via vpcmpeqb) reads a key/element
# slot holding foreign memory — observed values 0x6000000000000000 (the
# __rc_alloc header aid-magic, i.e. an uninitialized fresh allocation) and
# 8 (rdi=10==len("sequences") in the 2026-08-30 probe). The dict literal IR
# (Dict.ptr.jacval new/set_ph/find_ph, static FNV hashes, struct layout) is
# verified correct in the emitted module, so the corruption is runtime-side
# (RC/allocator interplay) in the full-module context only; minimal
# faithful repros pass at both opt levels. Next probe: RC release audit of
# the concat/field-store path in feed (`self.buffer += data`).
"ui.input" = "server"
# SEAL walls (2026-08-31 honest seal read) — dev-native, seal-server:
# screen E5092 create_session; transcript E5092 TranscriptView; renderer
# E1127 int->u64; layout ICE (_ScopedNode already defined — compiler bug;
# JAC_NATIVE_ICE_RAISE=1 surfaces the traceback); layout_compile E5092
# _shell_state. bindings/layout_measure/layout_quantize seal native.
"ui.bindings" = "native"
"ui.screen" = "native"
"ui.transcript" = "native"
"ui.renderer" = "native"
"ui.layout" = "native"
"ui.layout_measure" = "native"
"ui.layout_quantize" = "native"
# ui.layout_compile: test 51/51; the seal-time demote is NOT contained (the
# old note was wrong) — seals server on E5092 _shell_state (2026-08-31).
# ui.events: lowers in dev (test annex passes 69/69) BUT seal-time demotes due
# to cross-unit create_session from ui.runtime (UiSession boundary).
# Until that lands natively, events stays server.
"ui.events" = "server"
# inspect/demos: hold for the events frontier above (walker dispatch +
# annex walls); demos additionally spawn walkers (SetProgress).
"ui.inspect" = "server"
"ui.demo_complex_shell" = "server"
"ui.demo_live_shell" = "server"
# agent.protocol: Envelope/InProcessAdapter objs are constructed by server
# session/tui/demo consumers (class-boundary wall, see agent.tool_spec);
# drive_screen pokes shell.transcript/status attributes of server-pinned
# ui.screen ShellScreen across the boundary.
"agent.protocol" = "server"
# agent.tool_spec: NATIVE since the 2026-08-31 seal round-trip. The class-
# boundary wall (server code constructing a native-pinned obj class dies with
# NameError) is bypassed with the native factory fn `make_tool_spec` in
# tool_spec.jac: server consumers (tools.jac tool_specs(), registry.jac
# as_tool_specs()) construct through that seam; only test annexes still call
# ToolSpec(...) directly (jac test runs pre-seal, so it is unaffected by
# placement). Validated in the sealed artifact 2026-08-31 (dist/jackal.jab,
# temporary /seam probe): construction through the native factory, str/dict
# field reads, callable-field round-trip and registry invoke() all pass
# server<->native; seals native with no demotion.
# `jac test` does NOT honor [placement.pins] — suites always run pre-seal/
# server-side, so a pin flip MUST be validated by `jac build` + running the
# agent.registry: BLOCKED native (2026-08-31 seal probe; pin flipped and
# reverted after one honest round-trip). Its own constructions (create_registry
# /register_native/register_js) never hit the class-boundary wall — the seal
# refuses the module on three narrower walls: invoke's `ent.handler(**args)`
# call-argument unpacking (E5092, unsupported natively); openai_tools' list
# append; `any` unbox to JacStr. Fix those and re-flip; the manifest
# placement map (vendor fix 2026-08-31) reports the demotion either way.
"agent.registry" = "server"
"agent.plugin_bridge" = "server"
"agent.session" = "server"
# agent.extensions: BLOCKED native, two independent walls (probed 2026-08-25):
# (a) no native json.load/loads in jaclang -> load_extension_decls demotes to
#     Python-only, which forces the whole module server;
# (b) os.path.abspath / os.path.isabs unsupported natively (dirname/join/
#     isfile/getcwd ARE supported); ExtensionStatus/ExtensionDecl are
#     constructed server-side in session.jac anyway (class-boundary wall,
#     see agent.tool_spec above).
"agent.extensions" = "server"

[dependencies]
httpx = "~=0.28"
