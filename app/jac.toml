[project]
name = "jackal"
version = "0.1.0"
description = "Jackal - all-Jac na-codespace coding agent harness"
entry-point = "main.jac"

# Model config for the ambient `llm` builtin. api_key here is a fallback;
# provider env vars (e.g. OPENROUTER_API_KEY) take precedence.
[byllm.model]
default_model = "mockllm"
api_key = ""

# Pure compute: pin native (dogfooding target). Inference keeps core/edit
# server while its importer tools.jac is server-anchored, so pin explicitly.
[build]
default_codespace = "native"

[placement.pins]
# Constraint layout engine (LAYOUT-ENGINE-PLAN §3): the complete layout
# path stays server-pinned; no implicit native fallback.
"constraints.algebra" = "server"
"constraints.solver" = "server"
"constraints.layout_relations" = "server"
"core.edit" = "native"
"ui.model" = "server"
"ui.mutation" = "server"
"ui.bindings" = "server"
"ui.runtime" = "server"
"ui.events" = "server"
"ui.layout" = "server"
"ui.layout_compile" = "server"
"ui.layout_quantize" = "server"
"ui.layout_measure" = "server"
"ui.renderer" = "server"
"ui.screen" = "server"
"ui.transcript" = "server"
"ui.inspect" = "server"
"ui.demo_complex_shell" = "server"
"ui.demo_live_shell" = "server"
"agent.protocol" = "server"
"agent.tool_spec" = "server"
"agent.registry" = "server"
"agent.plugin_bridge" = "server"
"agent.extensions" = "server"
"agent.session" = "server"

[dependencies]
httpx = "~=0.28"
