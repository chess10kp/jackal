name: App tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: app-tests-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAC_VERSION: "0.38.2"
  JAC_SHA256: "c712b056820f67e3035d962a547c7eaea1908a497b63b4b89093fecb9b533ed4"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-jac
        with:
          version: ${{ env.JAC_VERSION }}
          sha256: ${{ env.JAC_SHA256 }}
      - name: jac check app/
        working-directory: app
        run: jac check .

  # Cheap static read of the native seal: a hard native pin (and the
  # .impl.jac / .test.jac annexes the seal folds into its unit) may not call
  # into a server-placed module — that is E5093 at seal time, and it is
  # decidable from source. The full `jac build` gate still needs a native
  # kernel; this job catches the boundary class on every push.
  seal-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Native pins vs server imports
        run: node scripts/seal-pin-guard.mjs

  # Memory profile of the harness process tree under the mock provider.
  # Always annotates; the strict 100 MB resident budget gates in
  # continue-with-warning mode until the native-only runtime lands
  # (bytecode-floor prep phase not counted).
  mem-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-jac
        with:
          version: ${{ env.JAC_VERSION }}
          sha256: ${{ env.JAC_SHA256 }}
      - name: Memory profile (resident + boot peaks)
        run: |
          scripts/mem-profile.sh \
            --budget-resident "${MEM_RESIDENT_BUDGET_MB:-700}" \
            --budget-boot "${MEM_BOOT_BUDGET_MB:-1400}"
      - name: Strict 100 MB resident target (warning until native-only)
        continue-on-error: true
        run: scripts/mem-profile.sh --budget-resident 100

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [agent, tui, ui, e2e, other]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: ./.github/actions/setup-jac
        with:
          version: ${{ env.JAC_VERSION }}
          sha256: ${{ env.JAC_SHA256 }}
      - name: Run suites (${{ matrix.shard }})
        env:
          TIMEOUT: "900"
        run: |
          Q="--quarantine scripts/test-quarantine.txt"
          case "${{ matrix.shard }}" in
            agent) scripts/test.sh -j3 $Q app/agent/ ;;
            tui)   scripts/test.sh -j3 $Q app/tui/ ;;
            ui)    scripts/test.sh -j3 $Q app/ui/ ;;
            e2e)   scripts/test.sh -j2 $Q app/e2e/ ;;
            other) scripts/test.sh -j3 $Q --exclude app/agent/ --exclude app/tui/ --exclude app/ui/ --exclude app/e2e/ ;;
          esac
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testlogs-${{ matrix.shard }}
          path: .testlogs/
          include-hidden-files: true
          retention-days: 7
