name: Jac toolchain

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  jac-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jaclang
        run: pip install jaclang

      - name: Jac toolchain + npm agent loop check
        run: npm run check:jac
